<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>からだのスタンプ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      touch-action: manipulation;
      box-sizing: border-box;
      margin: 0; padding: 0;
    }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #fef9f0; }
    canvas { display: block; }
    #screen-main { display: none; }
    #screen-settings { display: none; }

    /* ---- ロックリング（canvasオーバーレイ） ---- */
    .lock-wrap { position: relative; display: inline-flex; }
    .lock-ring {
      position: absolute; inset: 0;
      pointer-events: none;
      opacity: 0;
      border-radius: inherit;
    }

    /* ---- 右パネル ---- */
    #right-panel {
      display: flex;
      flex-direction: column;
      width: 36%;
      min-width: 160px;
      background: #f0f4f0;
      flex-shrink: 0;
    }
    #right-canvas-wrap {
      position: relative;
      flex: 1;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #right-canvas { position: absolute; inset: 0; }

    /* ---- 左パネル ---- */
    #left-panel { flex: 1; position: relative; background: #fafafa; }
    #left-canvas { position: absolute; inset: 0; }

    /* ---- 切替ボタン ---- */
    #switch-btn {
      position: absolute;
      top: 10px; right: 8px;
      display: flex; flex-direction: column; align-items: center;
      cursor: pointer; z-index: 10;
    }
    #switch-thumb-wrap {
      border: 3px solid #aaa;
      border-radius: 8px;
      overflow: hidden;
      background: white;
      width: 52px; height: 72px;
    }
    #switch-thumb { width: 100%; height: 100%; object-fit: contain; }

    /* ---- 設定モーダル ---- */
    #screen-settings {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.45);
      align-items: center; justify-content: center;
      z-index: 100;
    }
    #settings-box {
      background: white;
      border-radius: 24px;
      padding: 32px;
      width: min(460px, 92vw);
      box-shadow: 0 8px 40px rgba(0,0,0,0.2);
    }

    /* ---- トグルスイッチ ---- */
    .toggle-track {
      width: 56px; height: 30px;
      border-radius: 15px;
      background: #d1d5db;
      position: relative;
      cursor: pointer;
      transition: background 0.25s;
      flex-shrink: 0;
    }
    .toggle-track.on { background: #f472b6; }
    .toggle-knob {
      position: absolute;
      top: 3px; left: 3px;
      width: 24px; height: 24px;
      border-radius: 50%;
      background: white;
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
      transition: transform 0.25s;
    }
    .toggle-track.on .toggle-knob { transform: translateX(26px); }

    /* ---- ファイルドロップゾーン ---- */
    #drop-zone {
      border: 3px dashed #f9a8d4;
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      background: #fdf2f8;
      cursor: pointer;
    }
    #drop-zone.dragover { background: #fce7f3; border-color: #ec4899; }
  </style>
</head>
<body>

<!-- ===================== スタート画面 ===================== -->
<div id="screen-start"
  style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(160deg,#fff7e6 0%,#fef0f7 100%)">
  <div style="font-size:64px;margin-bottom:12px">💗</div>
  <h1 style="font-size:36px;font-weight:900;color:#e91e8c;margin-bottom:8px;letter-spacing:2px">からだのスタンプ</h1>
  <p style="font-size:18px;color:#aaa;margin-bottom:48px">すきなところにハートをはろう！</p>
  <button id="start-btn"
    style="background:#f472b6;color:white;font-size:36px;font-weight:900;padding:28px 72px;border-radius:32px;box-shadow:0 6px 24px rgba(244,114,182,0.4);border:none;cursor:pointer;min-width:280px;min-height:112px;transition:transform 0.1s"
    ontouchstart="this.style.transform='scale(0.95)'"
    ontouchend="this.style.transform='scale(1)'"
    onmousedown="this.style.transform='scale(0.95)'"
    onmouseup="this.style.transform='scale(1)'">
    はじめる
  </button>
</div>

<!-- ===================== メイン画面 ===================== -->
<div id="screen-main" style="position:fixed;inset:0;flex-direction:column;">

  <!-- ヘッダー -->
  <div id="header"
    style="display:flex;align-items:center;padding:8px 12px;background:white;box-shadow:0 1px 6px rgba(0,0,0,0.1);height:60px;flex-shrink:0;gap:10px;z-index:10">

    <div class="lock-wrap">
      <button id="settings-btn"
        style="display:flex;align-items:center;gap:6px;background:#f3f4f6;color:#555;font-size:18px;font-weight:700;padding:10px 18px;border-radius:16px;border:none;cursor:pointer;min-height:44px">
        ⚙ せってい
      </button>
      <canvas id="settings-ring" class="lock-ring"></canvas>
    </div>

    <div class="lock-wrap">
      <button id="clear-btn"
        style="display:flex;align-items:center;gap:6px;background:#fee2e2;color:#ef4444;font-size:18px;font-weight:700;padding:10px 18px;border-radius:16px;border:none;cursor:pointer;min-height:44px">
        🗑 すべて消す
      </button>
      <canvas id="clear-ring" class="lock-ring"></canvas>
    </div>

    <div id="counter-display"
      style="display:none;margin-left:auto;font-size:26px;font-weight:900;color:#f472b6;white-space:nowrap">
      のこり：<span id="counter-num">5</span>個
    </div>
  </div>

  <!-- メインエリア -->
  <div id="main-area" style="flex:1;display:flex;overflow:hidden;">

    <!-- 左パネル（ズームビュー） -->
    <div id="left-panel">
      <canvas id="left-canvas"></canvas>
    </div>

    <!-- 右パネル（全身図ナビ） -->
    <div id="right-panel">

      <div id="right-canvas-wrap">
        <canvas id="right-canvas"></canvas>

        <!-- 切替ボタン -->
        <div id="switch-btn">
          <div id="switch-thumb-wrap">
            <img id="switch-thumb" alt="切替">
          </div>
          <span style="font-size:13px;font-weight:700;color:#555;margin-top:4px">きりかえる</span>
        </div>
      </div>

      <!-- できたボタン -->
      <button id="save-btn"
        style="background:#fde047;color:#374151;font-size:30px;font-weight:900;border:none;cursor:pointer;border-radius:16px;margin:10px;height:68px;box-shadow:0 3px 12px rgba(0,0,0,0.12);transition:transform 0.1s"
        ontouchstart="this.style.transform='scale(0.96)'"
        ontouchend="this.style.transform='scale(1)'"
        onmousedown="this.style.transform='scale(0.96)'"
        onmouseup="this.style.transform='scale(1)'">
        できた
      </button>

    </div><!-- /right-panel -->
  </div><!-- /main-area -->
</div><!-- /screen-main -->

<!-- ===================== 設定モーダル ===================== -->
<div id="screen-settings">
  <div id="settings-box">
    <h2 style="font-size:28px;font-weight:900;color:#555;margin-bottom:24px">⚙ せってい</h2>

    <!-- 背景画像変更 -->
    <p style="font-size:18px;font-weight:700;color:#666;margin-bottom:10px">からだの図をかえる</p>
    <div id="drop-zone" onclick="document.getElementById('img-upload').click()">
      <div style="font-size:36px;margin-bottom:6px">📁</div>
      <p style="color:#888;font-size:16px">タップしてファイルをえらぶ</p>
      <p style="color:#bbb;font-size:13px;margin-top:4px">PNG / JPG</p>
    </div>
    <input type="file" id="img-upload" accept="image/*" style="display:none">

    <div style="margin-top:24px;margin-bottom:20px;border-top:1px solid #eee"></div>

    <!-- ハート上限 -->
    <p style="font-size:18px;font-weight:700;color:#666;margin-bottom:12px">ハートのかず</p>
    <div style="display:flex;align-items:center;gap:14px;margin-bottom:14px">
      <span style="font-size:16px;color:#777">上限なし</span>
      <div id="limit-toggle" class="toggle-track">
        <div class="toggle-knob"></div>
      </div>
      <span style="font-size:16px;color:#777">上限あり</span>
    </div>
    <div id="limit-slider-wrap" style="display:none;align-items:center;gap:12px">
      <input type="range" id="limit-slider" min="1" max="10" value="5"
        style="flex:1;height:10px;accent-color:#f472b6;cursor:pointer">
      <span id="limit-val" style="font-size:28px;font-weight:900;color:#f472b6;min-width:36px;text-align:center">5</span>
      <span style="font-size:18px;color:#666">個</span>
    </div>

    <!-- 閉じるボタン -->
    <button id="settings-close"
      style="width:100%;margin-top:28px;background:#f472b6;color:white;font-size:22px;font-weight:900;padding:16px;border-radius:16px;border:none;cursor:pointer">
      とじる
    </button>
  </div>
</div>

<!-- ===================== JavaScript ===================== -->

function loadImages(cb) {
  let n = 0;
  [['m',IMG_M],['f',IMG_F]].forEach(([g,src]) => {
    const img = new Image();
    img.onload = img.onerror = () => { if (++n === 2) cb(); };
    img.src = src;
    images[g] = img;
  });
}
const curImg = () => customImg || images[gender];

// ================================================================
// キャンバスリサイズ
// ================================================================
function resize() {
  const header  = $('header');
  const mainArea= $('main-area');
  const lPanel  = $('left-panel');
  const rPanel  = $('right-panel');
  const saveBtn = $('save-btn');

  // メインエリアの高さ
  const aH = window.innerHeight - header.offsetHeight;
  mainArea.style.height = aH + 'px';

  // 左キャンバス
  lc.width  = lPanel.clientWidth;
  lc.height = aH;

  // 右キャンバス（セーブボタン分を引く）
  const savH = saveBtn.offsetHeight + 20; // margin込み
  rc.width  = rPanel.clientWidth;
  rc.height = Math.max(100, aH - savH);

  render();
}
window.addEventListener('resize', resize);

// ================================================================
// ボディレイアウト（右キャンバス内の画像配置）
// ================================================================
function bodyLayout() {
  const img = curImg();
  if (!img || !img.naturalWidth) return { x:0, y:0, w:rc.width, h:rc.height };
  const ia = img.naturalWidth / img.naturalHeight;
  const ca = rc.width / rc.height;
  let w, h;
  if (ia < ca) { h = rc.height; w = h * ia; }
  else         { w = rc.width;  h = w / ia; }
  return { x:(rc.width-w)/2, y:(rc.height-h)/2, w, h };
}

// ================================================================
// ズームレイアウト（左キャンバス内の描画範囲）
// ================================================================
function zoomLayout() {
  const img = curImg();
  if (!img || !img.naturalWidth) return { sx:0,sy:0,sw:100,sh:100, dx:0,dy:0,dw:lc.width,dh:lc.height };
  const sw = frame.rw * img.naturalWidth;
  const sh = frame.rh * img.naturalHeight;
  const sx = frame.rx * img.naturalWidth;
  const sy = frame.ry * img.naturalHeight;
  const fa = sw / sh;
  const ca = lc.width / lc.height;
  let dw, dh, dx, dy;
  if (fa > ca) { dw=lc.width;  dh=dw/fa; dx=0;             dy=(lc.height-dh)/2; }
  else         { dh=lc.height; dw=dh*fa; dx=(lc.width-dw)/2; dy=0; }
  return { sx, sy, sw, sh, dx, dy, dw, dh };
}

// ================================================================
// 座標変換
// ================================================================
function leftToImgRel(lpx, lpy) {
  const z = zoomLayout();
  if (lpx < z.dx || lpx > z.dx+z.dw || lpy < z.dy || lpy > z.dy+z.dh) return null;
  return {
    rx: frame.rx + ((lpx - z.dx) / z.dw) * frame.rw,
    ry: frame.ry + ((lpy - z.dy) / z.dh) * frame.rh
  };
}
function imgRelToLeft(irx, iry) {
  const z = zoomLayout();
  return {
    lx: z.dx + ((irx - frame.rx) / frame.rw) * z.dw,
    ly: z.dy + ((iry - frame.ry) / frame.rh) * z.dh
  };
}
function rightToImgRel(rpx, rpy) {
  const bl = bodyLayout();
  if (rpx < bl.x || rpx > bl.x+bl.w || rpy < bl.y || rpy > bl.y+bl.h) return null;
  return { rx:(rpx-bl.x)/bl.w, ry:(rpy-bl.y)/bl.h };
}

// ================================================================
// ハート近傍検索
// ================================================================
function findHeart(irx, iry) {
  const img = curImg();
  if (!img) return null;
  const W = img.naturalWidth, H = img.naturalHeight;
  let best = null, bestD = Infinity;
  for (const h of hearts) {
    const dx = (h.rx - irx) * W;
    const dy = (h.ry - iry) * H;
    const d  = Math.hypot(dx, dy);
    const r  = Math.max(28, HEART_BASE_RADIUS * h.scale * 1.2);
    if (d < r && d < bestD) { best = h; bestD = d; }
  }
  return best;
}

// ================================================================
// ハート描画
// ================================================================
function drawStamp(ctx, cx, cy, r, alpha) {
  if (r < 3) return;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(cx, cy);

  // 薄い塗り
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(200, 10, 10, 0.10)';
  ctx.fill();

  // 外枠
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.strokeStyle = '#cc1111';
  ctx.lineWidth = Math.max(2, r * 0.11);
  ctx.stroke();

  // 内枠（二重円）
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.82, 0, Math.PI * 2);
  ctx.strokeStyle = '#cc1111';
  ctx.lineWidth = Math.max(1, r * 0.05);
  ctx.stroke();

  // 縦書き「だいじ」
  const chars = ['だ', 'い', 'じ'];
  const fontSize = r * 0.50;
  ctx.fillStyle = '#cc1111';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = `bold ${fontSize}px 'Hiragino Mincho ProN', 'Yu Mincho', 'MS Mincho', serif`;
  const spacing = fontSize * 1.05;
  chars.forEach((c, i) => {
    ctx.fillText(c, 0, -spacing + i * spacing);
  });

  ctx.restore();
}

// ================================================================
// レンダリング
// ================================================================
function renderLeft() {
  const img = curImg();
  lx.clearRect(0, 0, lc.width, lc.height);
  lx.fillStyle = '#f8f8f8';
  lx.fillRect(0, 0, lc.width, lc.height);
  if (!img || !img.naturalWidth) return;

  const z = zoomLayout();
  lx.drawImage(img, z.sx, z.sy, z.sw, z.sh, z.dx, z.dy, z.dw, z.dh);

  // 左枠ライン（ズームエリアの輪郭）
  lx.strokeStyle = 'rgba(255,50,50,0.15)';
  lx.lineWidth = 3;
  lx.strokeRect(z.dx+1, z.dy+1, z.dw-2, z.dh-2);

  // ハート描画
  const zScaleX = z.dw / z.sw;
  const zScaleY = z.dh / z.sh;
  const zScale  = Math.min(zScaleX, zScaleY);
  for (const h of hearts) {
    const p = imgRelToLeft(h.rx, h.ry);
    const r = HEART_BASE_RADIUS * h.scale * zScale;
    if (p.lx < -r*2 || p.lx > lc.width+r*2) continue;
    if (p.ly < -r*2 || p.ly > lc.height+r*2) continue;
    let hx = p.lx, hy = p.ly;
    if (h.shaking) {
      const t = (Date.now() - h.shakeStart) / 1000;
      const amp = r * 0.18;
      hx += Math.sin(t * Math.PI * 2 * 20) * amp;
      hy += Math.cos(t * Math.PI * 2 * 16) * amp * 0.65;
    }
    drawStamp(lx, hx, hy, r, 0.65);
  }

  // パーティクル
  for (const p of particles) {
    const t = p.life / p.maxLife;
    lx.save();
    lx.globalAlpha = t * 0.85;
    lx.fillStyle = p.color;
    lx.beginPath();
    lx.arc(p.lx, p.ly, p.r * t, 0, Math.PI*2);
    lx.fill();
    lx.restore();
  }
}

function renderRight() {
  const img = curImg();
  rx.clearRect(0, 0, rc.width, rc.height);
  rx.fillStyle = '#e8eee8';
  rx.fillRect(0, 0, rc.width, rc.height);
  if (!img || !img.naturalWidth) return;

  const bl = bodyLayout();
  rx.drawImage(img, bl.x, bl.y, bl.w, bl.h);

  // ハート（小さく）
  for (const h of hearts) {
    const px = bl.x + h.rx * bl.w;
    const py = bl.y + h.ry * bl.h;
    const r  = HEART_BASE_RADIUS * h.scale * (bl.w / img.naturalWidth);
    drawStamp(rx, px, py, Math.max(5, r), 0.7);
  }

  // 赤い枠
  const fx = bl.x + frame.rx * bl.w;
  const fy = bl.y + frame.ry * bl.h;
  const fw = frame.rw * bl.w;
  const fh = frame.rh * bl.h;
  rx.strokeStyle = '#ff2222';
  rx.lineWidth = 3;
  rx.strokeRect(fx, fy, fw, fh);
  // 四隅ハンドル
  const hs = 10;
  rx.fillStyle = '#ff2222';
  [[fx,fy],[fx+fw,fy],[fx,fy+fh],[fx+fw,fy+fh]].forEach(([cx,cy])=>{
    rx.fillRect(cx-hs/2, cy-hs/2, hs, hs);
  });
}

function render() { renderLeft(); renderRight(); }

// ================================================================
// アニメーションループ
// ================================================================
let prevTime = 0;
function loop(t) {
  requestAnimationFrame(loop);
  const dt = Math.min((t - prevTime) / 1000, 0.05);
  prevTime = t;
  let dirty = false;

  // パーティクル更新
  for (let i = particles.length-1; i >= 0; i--) {
    const p = particles[i];
    p.lx += p.vx; p.ly += p.vy;
    p.vy += 0.15; // 重力
    p.life -= dt * 3.5;
    if (p.life <= 0) { particles.splice(i,1); }
    dirty = true;
  }

  // 成長中ハート更新
  for (const h of hearts) {
    if (!h.growing) continue;
    dirty = true;
    const elapsed  = (Date.now() - h.growStart) / 1000;
    const progress = Math.min(elapsed / (GROW_DURATION/1000), 1);
    h.scale = 1 + progress * (MAX_SCALE - 1);
    updateGrowSound(h, progress);
    if (progress >= 1) {
      h.growing = false;
      h.shaking = true;
      h.shakeStart = Date.now();
      stopGrowSound(h);
      startShakeSound(h);
    }
  }

  // 震えてから破裂
  for (const h of hearts) {
    if (!h.shaking) continue;
    dirty = true;
    if (Date.now() - h.shakeStart >= SHAKE_DURATION) {
      burstHeart(h);
    }
  }

  if (dirty || particles.length > 0) render();
}
requestAnimationFrame(t => { prevTime = t; requestAnimationFrame(loop); });

// ================================================================
// ハート管理
// ================================================================
function addHeart(irx, iry) {
  if (settings.limitEnabled && hearts.length >= settings.limitCount) {
    playError(); return;
  }
  hearts.push({ id: nextId++, rx: irx, ry: iry, scale: 1, growing: false, growStart:0, shaking: false, shakeStart:0, osc:null, gainNode:null });
  playPon();
  updateCounter();
  render();
}

function burstHeart(h) {
  const idx = hearts.indexOf(h);
  if (idx < 0) return;
  stopGrowSound(h);
  hearts.splice(idx, 1);
  spawnParticles(h.rx, h.ry);
  playPachin();
  updateCounter();
  render();
}

// ================================================================
// パーティクル生成
// ================================================================
function spawnParticles(irx, iry) {
  const p  = imgRelToLeft(irx, iry);
  const n  = 5 + Math.floor(Math.random()*3);
  for (let i = 0; i < n; i++) {
    const angle = (Math.PI*2*i/n) + Math.random()*0.6;
    const spd   = 3 + Math.random()*3.5;
    particles.push({
      lx: p.lx, ly: p.ly,
      vx: Math.cos(angle)*spd,
      vy: Math.sin(angle)*spd - 1,
      r:  4 + Math.random()*5,
      life: 1, maxLife: 1,
      color: PTCL_COLORS[Math.floor(Math.random()*PTCL_COLORS.length)]
    });
  }
}

// ================================================================
// 音響（Web Audio API）
// ================================================================
function getACtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playPon() {
  try {
    const ac  = getACtx();
    const osc = ac.createOscillator();
    const g   = ac.createGain();
    osc.connect(g); g.connect(ac.destination);
    osc.type = 'triangle';
    const now = ac.currentTime;
    osc.frequency.setValueAtTime(900, now);
    osc.frequency.exponentialRampToValueAtTime(420, now+0.13);
    g.gain.setValueAtTime(0.35, now);
    g.gain.exponentialRampToValueAtTime(0.001, now+0.16);
    osc.start(now); osc.stop(now+0.16);
  } catch(e) {}
}

function playPachin() {
  try {
    const ac  = getACtx();
    const len = Math.floor(ac.sampleRate * 0.09);
    const buf = ac.createBuffer(1, len, ac.sampleRate);
    const d   = buf.getChannelData(0);
    for (let i=0; i<len; i++) d[i] = (Math.random()*2-1);
    const src = ac.createBufferSource(); src.buffer = buf;
    const bpf = ac.createBiquadFilter(); bpf.type='bandpass'; bpf.frequency.value=3200; bpf.Q.value=0.6;
    const g   = ac.createGain();
    src.connect(bpf); bpf.connect(g); g.connect(ac.destination);
    const now = ac.currentTime;
    g.gain.setValueAtTime(0.6, now);
    g.gain.exponentialRampToValueAtTime(0.001, now+0.09);
    src.start(now); src.stop(now+0.09);
  } catch(e) {}
}

function playError() {
  try {
    const ac  = getACtx();
    const osc = ac.createOscillator();
    const g   = ac.createGain();
    osc.connect(g); g.connect(ac.destination);
    osc.type = 'sine'; osc.frequency.value = 180;
    const now = ac.currentTime;
    g.gain.setValueAtTime(0.25, now);
    g.gain.exponentialRampToValueAtTime(0.001, now+0.22);
    osc.start(now); osc.stop(now+0.22);
  } catch(e) {}
}

function startGrowSound(h) {
  try {
    const ac  = getACtx();
    const osc = ac.createOscillator();
    const g   = ac.createGain();
    osc.connect(g); g.connect(ac.destination);
    osc.type = 'sine'; osc.frequency.value = 200;
    g.gain.value = 0.12;
    osc.start();
    h.osc = osc; h.gainNode = g;
  } catch(e) {}
}

function updateGrowSound(h, progress) {
  if (!h.osc) return;
  try { h.osc.frequency.setTargetAtTime(200 + progress*700, getACtx().currentTime, 0.05); } catch(e) {}
}

function stopGrowSound(h) {
  if (h.osc) { try { h.osc.stop(); h.osc.disconnect(); } catch(e) {} h.osc=null; h.gainNode=null; }
}

function startShakeSound(h) {
  try {
    const ac  = getACtx();
    const osc = ac.createOscillator();
    const g   = ac.createGain();
    osc.connect(g); g.connect(ac.destination);
    osc.type = 'triangle'; osc.frequency.value = 680;
    const now = ac.currentTime;
    const beats = Math.floor(SHAKE_DURATION / 100);
    for (let i = 0; i < beats; i++) {
      g.gain.setValueAtTime(0.07, now + i * 0.1);
      g.gain.setValueAtTime(0.0,  now + i * 0.1 + 0.055);
    }
    osc.start(now); osc.stop(now + SHAKE_DURATION / 1000 + 0.1);
    h.osc = osc; h.gainNode = g;
  } catch(e) {}
}

// ================================================================
// 左キャンバス　タッチ・マウスイベント
// ================================================================
function lcCoords(e) {
  const rect = lc.getBoundingClientRect();
  const t = e.touches ? (e.touches[0]||e.changedTouches[0]) : e;
  return { x: t.clientX - rect.left, y: t.clientY - rect.top };
}

function onLStart(e) {
  e.preventDefault();
  const {x,y} = lcCoords(e);
  const ir = leftToImgRel(x, y);
  if (!ir) return;

  lMoved  = false;
  const h = findHeart(ir.rx, ir.ry);
  lTouch  = { x, y, time: Date.now(), heart: h, dragging: false };

  if (h) {
    // 300ms後に成長開始
    lPressTimer = setTimeout(() => {
      if (!lMoved && lTouch && lTouch.heart === h) {
        h.growing   = true;
        h.growStart = Date.now();
        startGrowSound(h);
      }
    }, 300);
  }
}

function onLMove(e) {
  e.preventDefault();
  if (!lTouch) return;
  const {x,y} = lcCoords(e);
  if (Math.hypot(x - lTouch.x, y - lTouch.y) > 12) {
    if (!lMoved) {
      lMoved = true;
      clearTimeout(lPressTimer);
      if (lTouch.heart && lTouch.heart.growing) {
        lTouch.heart.growing = false;
        stopGrowSound(lTouch.heart);
      }
    }
    // 震えていないハートはドラッグで移動
    if (lTouch.heart && !lTouch.heart.shaking) {
      lTouch.dragging = true;
      const ir = leftToImgRel(x, y);
      if (ir) {
        lTouch.heart.rx = Math.max(0, Math.min(1, ir.rx));
        lTouch.heart.ry = Math.max(0, Math.min(1, ir.ry));
        render();
      }
    }
  }
}

function onLEnd(e) {
  e.preventDefault();
  clearTimeout(lPressTimer);
  if (!lTouch) return;

  const {x,y} = lcCoords(e);
  const h = lTouch.heart;

  if (lTouch.dragging) {
    // ドラッグ完了 → 位置は既に更新済み
  } else if (!lMoved) {
    if (h) {
      if (h.growing) {
        // 長押し途中で離した → 現サイズでキープ
        h.growing = false;
        stopGrowSound(h);
      } else {
        // タップ → 消去（震え中でも即破裂）
        burstHeart(h);
      }
    } else {
      // 空きをタップ → 配置
      const ir = leftToImgRel(x, y);
      if (ir) addHeart(ir.rx, ir.ry);
    }
  }

  lTouch = null;
}

lc.addEventListener('touchstart',  onLStart, {passive:false});
lc.addEventListener('touchmove',   onLMove,  {passive:false});
lc.addEventListener('touchend',    onLEnd,   {passive:false});
lc.addEventListener('touchcancel', onLEnd,   {passive:false});
lc.addEventListener('mousedown',   onLStart);
lc.addEventListener('mousemove',   onLMove);
lc.addEventListener('mouseup',     onLEnd);

// ================================================================
// 右キャンバス　フレームドラッグ
// ================================================================
function rcCoords(e) {
  const rect = rc.getBoundingClientRect();
  const t = e.touches ? (e.touches[0]||e.changedTouches[0]) : e;
  return { x: t.clientX - rect.left, y: t.clientY - rect.top };
}

function onRStart(e) {
  e.preventDefault();
  const {x,y} = rcCoords(e);
  const bl = bodyLayout();
  const fx = bl.x + frame.rx * bl.w;
  const fy = bl.y + frame.ry * bl.h;
  const fw = frame.rw * bl.w;
  const fh = frame.rh * bl.h;
  if (x >= fx && x <= fx+fw && y >= fy && y <= fy+fh) {
    dragging = true;
    dragOff  = { x: x-fx, y: y-fy };
  }
}

function onRMove(e) {
  e.preventDefault();
  if (!dragging) return;
  const {x,y} = rcCoords(e);
  const bl    = bodyLayout();
  let nx = (x - dragOff.x - bl.x) / bl.w;
  let ny = (y - dragOff.y - bl.y) / bl.h;
  // クランプ
  nx = Math.max(0, Math.min(1 - frame.rw, nx));
  ny = Math.max(0, Math.min(1 - frame.rh, ny));
  frame.rx = nx; frame.ry = ny;
  render();
}

function onREnd(e) {
  e.preventDefault();
  dragging = false;
}

rc.addEventListener('touchstart',  onRStart, {passive:false});
rc.addEventListener('touchmove',   onRMove,  {passive:false});
rc.addEventListener('touchend',    onREnd,   {passive:false});
rc.addEventListener('touchcancel', onREnd,   {passive:false});
rc.addEventListener('mousedown',   onRStart);
rc.addEventListener('mousemove',   onRMove);
rc.addEventListener('mouseup',     onREnd);

// ================================================================
// ペアレンタルロック
// ================================================================
function setupLock(btnId, ringId, action) {
  const btn  = $(btnId);
  const ring = $(ringId);
  let pressing = false, rafId = null, t0 = 0;

  function draw(progress) {
    ring.width  = btn.offsetWidth;
    ring.height = btn.offsetHeight;
    const ctx = ring.getContext('2d');
    ctx.clearRect(0, 0, ring.width, ring.height);
    const cx = ring.width/2, cy = ring.height/2;
    const r  = Math.min(ring.width, ring.height)/2 - 4;
    ctx.beginPath();
    ctx.arc(cx, cy, r, -Math.PI/2, -Math.PI/2 + Math.PI*2*progress);
    ctx.strokeStyle = 'rgba(245,158,11,0.9)';
    ctx.lineWidth   = 5;
    ctx.lineCap     = 'round';
    ctx.stroke();
  }

  function tick() {
    if (!pressing) return;
    const p = Math.min((Date.now()-t0)/LOCK_DURATION, 1);
    draw(p);
    if (p < 1) { rafId = requestAnimationFrame(tick); }
    else { ring.style.opacity='0'; pressing=false; action(); }
  }

  function start(e) {
    e.preventDefault();
    if (pressing) return;
    pressing = true; t0 = Date.now();
    ring.style.opacity = '1';
    rafId = requestAnimationFrame(tick);
  }

  function stop(e) {
    e.preventDefault();
    if (!pressing) return;
    pressing = false;
    cancelAnimationFrame(rafId);
    ring.style.opacity = '0';
    const ctx = ring.getContext('2d');
    if (ctx) ctx.clearRect(0,0,ring.width,ring.height);
  }

  btn.addEventListener('touchstart',  start, {passive:false});
  btn.addEventListener('touchend',    stop,  {passive:false});
  btn.addEventListener('touchcancel', stop,  {passive:false});
  btn.addEventListener('mousedown',   start);
  btn.addEventListener('mouseup',     stop);
  btn.addEventListener('mouseleave',  stop);
}

setupLock('settings-btn', 'settings-ring', () => {
  $('screen-settings').style.display = 'flex';
});
setupLock('clear-btn', 'clear-ring', () => {
  hearts.length = 0;
  updateCounter();
  render();
});

// ================================================================
// 設定
// ================================================================
function updateCounter() {
  const disp = $('counter-display');
  if (settings.limitEnabled) {
    disp.style.display = 'block';
    $('counter-num').textContent = Math.max(0, settings.limitCount - hearts.length);
  } else {
    disp.style.display = 'none';
  }
}

$('limit-toggle').addEventListener('click', () => {
  settings.limitEnabled = !settings.limitEnabled;
  const tk = $('limit-toggle');
  tk.classList.toggle('on', settings.limitEnabled);
  $('limit-slider-wrap').style.display = settings.limitEnabled ? 'flex' : 'none';
  updateCounter();
});

$('limit-slider').addEventListener('input', e => {
  settings.limitCount = parseInt(e.target.value);
  $('limit-val').textContent = e.target.value;
  updateCounter();
});

$('settings-close').addEventListener('click', () => {
  $('screen-settings').style.display = 'none';
});

// ドラッグ＆ドロップ
const dz = $('drop-zone');
dz.addEventListener('dragover',  e => { e.preventDefault(); dz.classList.add('dragover'); });
dz.addEventListener('dragleave', ()=> dz.classList.remove('dragover'));
dz.addEventListener('drop', e => {
  e.preventDefault(); dz.classList.remove('dragover');
  const file = e.dataTransfer.files[0];
  if (file) loadCustomImage(file);
});
$('img-upload').addEventListener('change', e => {
  if (e.target.files[0]) loadCustomImage(e.target.files[0]);
});

function loadCustomImage(file) {
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => { customImg = img; render(); };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

// ================================================================
// 男女切替
// ================================================================
function updateThumb() {
  const other = gender === 'm' ? 'f' : 'm';
  const th    = $('switch-thumb');
  if (images[other] && images[other].src) th.src = images[other].src;
}

$('switch-btn').addEventListener('click', () => {
  gender    = gender === 'm' ? 'f' : 'm';
  customImg = null;
  // ハートの位置はそのまま維持（画像相対座標なので変更不要）
  updateThumb();
  render();
});

// ================================================================
// 保存（できた）
// ================================================================
$('save-btn').addEventListener('click', () => {
  const img = curImg();
  if (!img || !img.naturalWidth) return;

  const cv  = document.createElement('canvas');
  cv.width  = img.naturalWidth;
  cv.height = img.naturalHeight;
  const ctx = cv.getContext('2d');

  try { ctx.drawImage(img, 0, 0); }
  catch(e) { alert('画像の描画に失敗しました。'); return; }

  for (const h of hearts) {
    const px = h.rx * img.naturalWidth;
    const py = h.ry * img.naturalHeight;
    const r  = HEART_BASE_RADIUS * h.scale;
    drawStamp(ctx, px, py, r, 0.65);
  }

  try {
    cv.toBlob(blob => {
      const url = URL.createObjectURL(blob);
      const a   = document.createElement('a');
      a.href     = url;
      a.download = 'stamped_body.png';
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 200);
    }, 'image/png');
  } catch(e) {
    alert('保存に失敗しました。スクリーンショットをご利用ください。');
  }
});

// ================================================================
// スタートボタン
// ================================================================
$('start-btn').addEventListener('click', () => {
  getACtx(); // ユーザージェスチャーで AudioContext 初期化
  $('screen-start').style.display = 'none';
  $('screen-main').style.display  = 'flex';
  resize();
});

// ================================================================
// 初期化
// ================================================================
loadImages(() => {
  updateThumb();
  render();
});
</script>
